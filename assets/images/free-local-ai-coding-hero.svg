<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Circuit-like decorative lines -->
  <g stroke="url(#accent1)" stroke-width="1.5" fill="none" opacity="0.25" filter="url(#glow)">
    <path d="M 100 315 L 250 315 L 300 200 L 450 200"/>
    <circle cx="450" cy="200" r="4" fill="#38bdf8" opacity="0.5"/>
    <path d="M 750 430 L 900 430 L 950 315 L 1100 315"/>
    <circle cx="950" cy="315" r="4" fill="#818cf8" opacity="0.5"/>
    <path d="M 200 500 L 350 500 L 400 400 L 500 400 L 550 500 L 700 500"/>
    <circle cx="550" cy="500" r="4" fill="#34d399" opacity="0.5"/>
    <path d="M 600 100 L 600 200 L 700 300 L 700 400"/>
    <circle cx="600" cy="100" r="4" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Central icon: laptop with local AI symbol -->
  <g transform="translate(500, 180)" filter="url(#glow)">
    <!-- Laptop body -->
    <rect x="0" y="60" width="200" height="130" rx="8" fill="none" stroke="url(#accent1)" stroke-width="2" opacity="0.8"/>
    <rect x="10" y="70" width="180" height="100" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Screen content lines -->
    <line x1="30" y1="95" x2="120" y2="95" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="110" x2="100" y2="110" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="125" x2="140" y2="125" stroke="#34d399" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="140" x2="80" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
    <!-- Laptop base -->
    <path d="M -30 190 L 230 190 L 250 210 L -50 210 Z" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
    <!-- Local chip icon on screen -->
    <rect x="130" y="85" width="40" height="40" rx="4" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
    <circle cx="150" cy="105" r="6" fill="#34d399" opacity="0.4"/>
    <line x1="150" y1="85" x2="150" y2="75" stroke="#34d399" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="125" x2="150" y2="135" stroke="#34d399" stroke-width="1" opacity="0.5"/>
    <line x1="130" y1="105" x2="120" y2="105" stroke="#34d399" stroke-width="1" opacity="0.5"/>
    <line x1="170" y1="105" x2="180" y2="105" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Floating nodes -->
  <g opacity="0.4">
    <circle cx="150" cy="120" r="3" fill="#38bdf8"/>
    <circle cx="1050" cy="150" r="3" fill="#818cf8"/>
    <circle cx="100" cy="450" r="3" fill="#34d399"/>
    <circle cx="1100" cy="480" r="3" fill="#38bdf8"/>
    <circle cx="300" cy="550" r="2" fill="#818cf8"/>
    <circle cx="900" cy="100" r="2" fill="#34d399"/>
  </g>

  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f1f5f9">
    Free Local AI for Coding
  </text>

  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">
    Claude-like quality. Zero subscription. No internet required.
  </text>

  <!-- Accent line -->
  <line x1="480" y1="510" x2="720" y2="510" stroke="url(#accent1)" stroke-width="2" opacity="0.5"/>

  <!-- Bottom tag -->
  <text x="600" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" letter-spacing="2">
    OPENAGENTS CONTROL &#8226; LOCAL MODELS &#8226; DEVELOPER WORKFLOW
  </text>
</svg>
